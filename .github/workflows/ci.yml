# Verificación de cada cambio: la misma prueba de terminación del plan (lint, tipos, tokens, unitarias, builds y E2E con axe).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, pruebas y builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Tokens al día con Figma
        run: npm run tokens:check

      - name: Pruebas unitarias
        run: npm test

      - name: Build de la librería
        run: npm run build:uki

      - name: Build de la documentación
        run: npm run build:demo

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E con axe
        run: npm run e2e

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
